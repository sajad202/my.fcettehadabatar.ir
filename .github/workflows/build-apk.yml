name: Build Android APK (Official Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore & Copy Icons
        working-directory: android-build
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias ettehad \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass Ettehad1405@ \
              -keypass Ettehad1405@ \
              -dname "CN=Ettehad Abatar, OU=Media, O=FcEttehadAbatar, L=SowmeehSara, S=Gilan, C=IR"
          fi
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          if [ -f icons/icon-512.png ]; then
            cp icons/icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icons/icon-512.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          fi
          if [ -f icons/icon-192.png ]; then
            cp icons/icon-192.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icons/icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icons/icon-192.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

      - name: Build Signed Release & Debug APK with Gradle
        working-directory: android-build
        run: |
          gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare Clean APK Output Files
        working-directory: android-build
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/EttehadAbatar-v18.0.0-Release-Signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/EttehadAbatar-v18.0.0-Debug.apk
          keytool -list -v -keystore release.keystore -storepass Ettehad1405@ | grep -E "SHA256:" > output-apk/SHA256-Fingerprint.txt || true

      - name: Upload Official Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EttehadAbatar-Android-APK
          path: |
            android-build/output-apk/*.apk
            android-build/output-apk/*.txt
