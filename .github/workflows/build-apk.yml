name: Build Android APK (TWA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android APK via Bubblewrap TWA
        run: |
          cd android-build
          echo "Building APK from twa-manifest.json..."
          bubblewrap build --skipSigning || bubblewrap build
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EttehadAbatar-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
