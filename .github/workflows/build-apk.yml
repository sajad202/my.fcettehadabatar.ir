name: Build Android APK (TWA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'

      - name: Fix Android SDK paths for Bubblewrap
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
            FIRST_CMD_TOOL=$(find "$SDK_DIR/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$FIRST_CMD_TOOL" ]; then
              ln -sfn "$FIRST_CMD_TOOL" "$SDK_DIR/cmdline-tools/latest"
            fi
          fi

      - name: Install and Configure Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Prepare Signing Keystore and Update TWA Project
        working-directory: android-build
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias ettehad \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass Ettehad1405@ \
              -keypass Ettehad1405@ \
              -dname "CN=Ettehad Abatar, OU=Media, O=FcEttehadAbatar, L=SowmeehSara, S=Gilan, C=IR"
          fi
          bubblewrap update --skipVersionUpgrade

      - name: Build Signed Android APK
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Ettehad1405@' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Ettehad1405@' }}
        run: |
          bubblewrap build

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EttehadAbatar-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
