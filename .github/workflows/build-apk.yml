name: Build Android APK (TWA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install and Configure Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat << 'EOF' > ~/.bubblewrap/config.json
          {
            "jdkPath": "/usr/lib/jvm/temurin-17-jdk-amd64",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Prepare Signing Keystore and Update TWA Project
        working-directory: android-build
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias ettehad \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass Ettehad1405@ \
              -keypass Ettehad1405@ \
              -dname "CN=Ettehad Abatar, OU=Media, O=FcEttehadAbatar, L=SowmeehSara, S=Gilan, C=IR"
          fi
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.signingKey = { path: "./release.keystore", alias: "ettehad" };
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '
          bubblewrap update --skipVersionUpgrade

      - name: Build Signed Android APK
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Ettehad1405@' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Ettehad1405@' }}
        run: |
          bubblewrap build

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EttehadAbatar-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
